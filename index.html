<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary Meta ── -->
    <title>Prodesk IT — Digital Solutions for Modern Businesses</title>
    <meta
      name="description"
      content="Prodesk IT helps businesses transform ideas into powerful digital products through strategy, design, and technology. Web development, UI/UX design, and digital strategy."
    />
    <meta name="theme-color" content="#4F6F64" />
    <meta name="robots" content="index, follow" />

    <!-- ── Open Graph ── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Prodesk IT — Digital Solutions for Modern Businesses" />
    <meta
      property="og:description"
      content="We help businesses transform ideas into powerful digital products through strategy, design, and technology."
    />
    <meta property="og:image" content="/assets/images/hero-visual.webp" />
    <!-- Add canonical og:url after deployment: -->
    <!-- <meta property="og:url" content="https://your-domain.com" /> -->

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prodesk IT — Digital Solutions" />
    <meta name="twitter:description" content="Strategy, design, and technology for forward-thinking businesses." />
    <meta name="twitter:image" content="/assets/images/hero-visual.webp" />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- 
      Preconnect to Google Fonts servers for faster font loading.
      The actual @import is in global.css — we only preconnect here.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
